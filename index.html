<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="An interactive first-week journey for new employees.">
<title>First Week Quest</title>
<link rel="stylesheet" href="style.css">
<script src="content.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">✦</span> First Week<span class="accent">Quest</span></div><label class="track">Journey <select id="track"><option value="bank">Bank · Business Intelligence</option><option value="team">General · Operations</option></select></label></header>
<main>
<section class="intro">
<div class="hero"><p class="eyebrow"><span class="dot"></span> SAMPLE ONBOARDING JOURNEY</p><h1>Your first week<br><em>starts here.</em></h1><p id="welcome"></p><button class="primary" id="resume">Start journey <span aria-hidden="true">→</span></button></div>
<div class="art" aria-hidden="true"><div class="orbit o1"></div><div class="orbit o2"></div><div class="orbit o3"></div><div class="north">N</div><div class="compass">✦</div><span class="star s1">+</span><span class="star s2">+</span><span class="star s3">+</span></div>
</section>
<section class="journey" aria-labelledby="journey-title">
<div class="heading"><div><h2 id="journey-title">Your journey</h2><p>Six missions to get to know your company and team.</p></div><div class="progress"><span id="count"></span><progress id="progress" max="6" value="0" aria-label="Missions completed"></progress></div></div>
<div class="cards" id="cards"></div>
</section>
<footer><span>First Week Quest</span><span>Progress is saved in this browser.</span></footer>
</main>
<dialog id="mission" aria-labelledby="mission-title"><div class="dialog-top"><p class="eyebrow" id="mission-type"></p><button class="close" aria-label="Close mission">×</button></div><h2 id="mission-title"></h2><p class="guide" id="guide"></p><p class="brief" id="brief"></p><form id="form"><fieldset><legend id="question"></legend><div id="choices"></div></fieldset><p id="feedback" role="status"></p><button class="primary" id="action" type="submit">Check answer</button></form></dialog>
</body>
</html>
